<div class="container mt-5 px-3">
  <div class="form-card mx-auto bg-white p-5 rounded-5 shadow-lg border-0" style="max-width: 650px;">
    <h2 class="fw-bold text-dark text-center mb-4 border-bottom pb-3">
      {{ id() ? 'עריכת משימה' : 'משימה חדשה' }}
    </h2>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="label-luxury">כותרת המשימה</label>
        <input type="text" class="form-control luxury-input" formControlName="Title" placeholder="מה המשימה שלך?">
      </div>

      <div class="mb-4">
        <label class="label-luxury">תיאור (אופציונלי)</label>
        <textarea class="form-control luxury-input" formControlName="Description" rows="3"></textarea>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="label-luxury">סטטוס</label>
          <select class="form-select luxury-input" formControlName="StatusId">
            <option [ngValue]="null">בחר סטטוס...</option>
            @for (s of statuses; track s.Id) { <option [value]="s.Id">{{ s.StatusName }}</option> }
          </select>
        </div>
        <div class="col-md-6">
          <label class="label-luxury">קטגוריה</label>
          <select class="form-select luxury-input" formControlName="CategoryId">
            <option [ngValue]="null">בחר קטגוריה...</option>
            @for (c of categories; track c.Id) { <option [value]="c.Id">{{ c.CategoryName }}</option> }
          </select>
        </div>
      </div>

      @if (saveSuccess) {
        <div class="alert alert-success rounded-pill text-center animate-pop">✓ המשימה נשמרה בהצלחה!</div>
      }

      <div class="d-flex justify-content-between mt-5 pt-4 border-top">
        <button type="button" class="btn btn-link text-muted fw-bold" (click)="goBack()">ביטול</button>
        <button type="submit" class="btn btn-dark px-5 rounded-pill shadow" [disabled]="taskForm.invalid || isSaving">
          {{ id() ? 'שמור שינויים' : 'צור משימה חדשה' }}
        </button>
      </div>
    </form>
  </div>
</div>
